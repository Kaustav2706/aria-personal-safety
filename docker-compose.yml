version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aria-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aria-network

  backend:
    build: ./backend
    container_name: aria-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/aria
      - AI_ENGINE_URL=http://ai-engine:8000
      - AI_ENGINE_SECRET=${AI_ENGINE_SECRET}
      - POLICE_API_KEY=${POLICE_API_KEY}
      - TWILIO_SID=${TWILIO_SID}
      - TWILIO_TOKEN=${TWILIO_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - BACKEND_URL=${BACKEND_URL}
    depends_on:
      - postgres
    networks:
      - aria-network

  ai-engine:
    build: ./ai-engine
    container_name: aria-ai-engine
    ports:
      - "8000:8000"
    networks:
      - aria-network

volumes:
  pgdata:

networks:
  aria-network:
    driver: bridge
